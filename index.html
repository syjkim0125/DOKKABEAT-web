<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17152b">
<title>DOKKABEAT</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#17152b; color:#fff; font-family:system-ui,sans-serif; }
#frame { position:fixed; inset:0; }
#canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
#status,#rotate { position:fixed; inset:0; display:grid; place-content:center; text-align:center; gap:18px; padding:24px; background:#17152b; z-index:2; }
#status[hidden],#rotate { display:none; }
h1 { font-size:clamp(24px,6vw,42px); margin:0; color:#72eff2; }
p { margin:0; line-height:1.6; }
progress { width:min(320px,80vw); justify-self:center; accent-color:#72eff2; }
@media (pointer:coarse) {
  #frame { top:max(env(safe-area-inset-top),8px); right:max(env(safe-area-inset-right),8px); bottom:max(env(safe-area-inset-bottom),8px); left:max(env(safe-area-inset-left),8px); }
}
@media (pointer:coarse) and (orientation:portrait) {
  #rotate { display:grid; z-index:3; }
}
</style>

</head>
<body>
<div id="frame"><canvas id="canvas" width="960" height="540" tabindex="0" aria-label="DOKKABEAT 게임"></canvas></div>
<div id="status" role="status"><h1>DOKKABEAT</h1><p id="loading">게임을 불러오는 중</p><progress id="progress"></progress></div>
<div id="rotate"><h1>가로로 돌려주세요</h1><p>진행 중인 전투는 일시정지됩니다.<br>가로로 돌린 후 RESUME을 눌러 재개하세요.</p></div>
<script src="index.js"></script>
<script>
'use strict';
const canvas = document.getElementById('canvas');
const frame = document.getElementById('frame');
const statusBox = document.getElementById('status');
const loading = document.getElementById('loading');
const progress = document.getElementById('progress');
// CSS safe-area insets reserve space for notches/home bars. A bounded framebuffer
// avoids multiplying GPU work by devicePixelRatio on high-density phones.
function resizeCanvas() {
  const width = Math.max(1, Math.floor(frame.clientWidth));
  const height = Math.max(1, Math.floor(frame.clientHeight));
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
}
new ResizeObserver(resizeCanvas).observe(frame);
window.addEventListener('resize', resizeCanvas);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
canvas.addEventListener('contextmenu', event => event.preventDefault());
resizeCanvas();
const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":88020,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
engine.startGame({
  canvas,
  canvasResizePolicy: 0,
  onProgress: (current,total) => {
    if (total > 0) { progress.max = total; progress.value = current; }
    else progress.removeAttribute('value');
  },
  onExit: () => {
    statusBox.hidden = false;
    loading.textContent = '게임이 종료되었습니다. 페이지를 새로고침해 다시 시작하세요.';
    progress.hidden = true;
  }
}).then(() => {
  statusBox.hidden = true;
  resizeCanvas();
  canvas.focus();
}).catch(error => {
  statusBox.hidden = false;
  progress.hidden = true;
  loading.textContent = '게임을 불러오지 못했습니다. Safari 또는 Chrome에서 다시 열어주세요. ' + String(error);
  console.error(error);
});
</script>
</body>
</html>
